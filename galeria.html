<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galería | Memo Mix</title>
<style>
:root{--bg:#02040c;--pink:#ff2bd6;--cyan:#00f0ff;--txt:#f4eefc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
header{max-width:1100px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:clamp(1.2rem,4vw,2rem);text-transform:uppercase;letter-spacing:3px;color:#eaffff;text-shadow:0 0 10px var(--cyan);border-left:4px solid var(--pink);padding-left:12px}
a.back,.f{color:var(--cyan);border:1px solid var(--cyan);background:transparent;padding:8px 14px;border-radius:20px;font:700 .8rem 'Segoe UI',sans-serif;text-transform:uppercase;text-decoration:none;cursor:pointer}
.f.sel{background:var(--pink);border-color:var(--pink);color:#fff}
.bar{max-width:1100px;margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap}
.gal{max-width:1100px;margin:0 auto;columns:2 160px;column-gap:12px}
.gal figure{break-inside:avoid;margin-bottom:12px}
.gal img{width:100%;display:block;border-radius:6px;border:1px solid rgba(0,240,255,.35);cursor:zoom-in;transition:transform .2s,box-shadow .2s}
.gal img:hover{transform:scale(1.03);box-shadow:0 0 20px rgba(0,240,255,.5)}
.lb{display:none;position:fixed;inset:0;z-index:300;background:rgba(2,4,12,.95);align-items:center;justify-content:center;padding:16px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:6px}
</style></head><body>
<header><h1>🎨 Galería Memo Mix</h1><a class="back" href="mmmix.html">← Volver</a></header>
<div class="bar"><button class="f sel" data-g="all">Todo</button><button class="f" data-g="arte">Arte creativo</button><button class="f" data-g="cartel">Carteles y en vivo</button></div>
<div class="gal" id="gal"></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbimg" alt=""></div>
<script>
const G=[["memonopoly", "Memonopoly", "arte"], ["cassette", "Cassette Memo Mix", "arte"], ["retro", "Estilo Retro", "arte"], ["tepito", "Tepito", "arte"], ["muneco-dj", "Memo DJ", "arte"], ["pelotero", "Pelotero la Bola", "arte"], ["sonido-baile", "Baile sonidero", "arte"], ["el-comandante", "El Comandante", "arte"], ["mascara", "Máscara Memo Mix", "arte"], ["en-vivo", "En vivo", "cartel"], ["cartel-penon", "Peñón de los Baños", "cartel"], ["cartel-san-juanico", "Posada San Juanico", "cartel"], ["cartel-quetzalcoatl", "Quetzalcóatl", "cartel"]];
const gal=document.getElementById('gal');
function draw(g){gal.innerHTML=G.filter(x=>g==='all'||x[2]===g).map(x=>`<figure><img src="img/${x[0]}.jpg" alt="${x[1]}" loading="lazy" onclick="lbimg.src=this.src;lb.classList.add('on')"></figure>`).join('')}
document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.toggle('sel',x===b));draw(b.dataset.g)});
draw('all');
</script></body></html>
